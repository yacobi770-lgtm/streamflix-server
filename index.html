<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060A12">
    <title>SratTV - סטרימינג ישראלי</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060A12;
            color: #F1F5FF;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        .header {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #0F1929 0%, #1A2847 100%);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid rgba(79, 142, 255, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #4F8EFF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(79, 142, 255, 0.3);
            border-radius: 25px;
            padding: 8px 15px;
            width: 250px;
            margin: 0 auto;
        }

        .search-bar input {
            background: none;
            border: none;
            color: #F1F5FF;
            width: 100%;
            outline: none;
            font-size: 14px;
        }

        .search-bar input::placeholder {
            color: rgba(241, 245, 255, 0.5);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(79,142,255,0.7)" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>') center/contain no-repeat;
        }

        .nav-toggle {
            width: 40px;
            height: 40px;
            background: rgba(79, 142, 255, 0.2);
            border: none;
            border-radius: 50%;
            color: #4F8EFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-toggle:hover {
            background: rgba(79, 142, 255, 0.3);
        }

        .user-menu {
            display: none;
            position: absolute;
            top: 60px;
            right: 20px;
            background: #0F1929;
            border: 1px solid rgba(79, 142, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            z-index: 200;
            min-width: 180px;
        }

        .user-menu.active {
            display: block;
        }

        .user-menu button {
            display: block;
            width: 100%;
            padding: 10px;
            background: none;
            border: none;
            color: #F1F5FF;
            cursor: pointer;
            text-align: right;
            font-size: 14px;
            border-radius: 5px;
        }

        .user-menu button:hover {
            background: rgba(79, 142, 255, 0.2);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, rgba(79, 142, 255, 0.1) 0%, rgba(0, 212, 255, 0.05) 100%);
            border-radius: 15px;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #4F8EFF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 18px;
            color: rgba(241, 245, 255, 0.7);
        }

        .section-title {
            font-size: 24px;
            margin: 30px 0 20px;
            color: #7DD3FC;
            font-weight: 600;
        }

        .carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        .carousel::-webkit-scrollbar {
            height: 6px;
        }

        .carousel::-webkit-scrollbar-track {
            background: rgba(79, 142, 255, 0.1);
            border-radius: 3px;
        }

        .carousel::-webkit-scrollbar-thumb {
            background: rgba(79, 142, 255, 0.5);
            border-radius: 3px;
        }

        .movie-card {
            flex: 0 0 180px;
            aspect-ratio: 9/13;
            background: linear-gradient(135deg, #1A2847 0%, #0F1929 100%);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(79, 142, 255, 0.2);
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            border-color: #4F8EFF;
            box-shadow: 0 10px 30px rgba(79, 142, 255, 0.3);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #060A12, transparent);
            padding: 10px;
            height: 60%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .movie-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .movie-rating {
            font-size: 12px;
            color: #FFD700;
        }

        .auth-section {
            background: linear-gradient(135deg, #1A2847 0%, #0F1929 100%);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: 40px auto;
            border: 1px solid rgba(79, 142, 255, 0.3);
        }

        .auth-section h2 {
            margin-bottom: 20px;
            color: #4F8EFF;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: rgba(241, 245, 255, 0.7);
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: rgba(79, 142, 255, 0.1);
            border: 1px solid rgba(79, 142, 255, 0.3);
            border-radius: 8px;
            color: #F1F5FF;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4F8EFF;
            background: rgba(79, 142, 255, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4F8EFF, #00D4FF);
            border: none;
            border-radius: 8px;
            color: #060A12;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 142, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .toggle-btn {
            background: rgba(79, 142, 255, 0.2);
            color: #4F8EFF;
            margin-top: 10px;
            cursor: pointer;
        }

        .toggle-btn:hover {
            background: rgba(79, 142, 255, 0.3);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group a {
            color: #4F8EFF;
            text-decoration: none;
            font-size: 12px;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #0F1929 0%, #1A2847 100%);
            border-top: 1px solid rgba(79, 142, 255, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 70px;
            z-index: 99;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: rgba(241, 245, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: none;
            font-size: 12px;
        }

        .nav-item:hover,
        .nav-item.active {
            color: #4F8EFF;
        }

        .nav-icon {
            font-size: 24px;
        }

        .player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .player-container.active {
            display: flex;
        }

        .player-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(79, 142, 255, 0.3);
            border: none;
            color: #F1F5FF;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            z-index: 10;
        }

        .countdown {
            text-align: center;
            color: #F1F5FF;
        }

        .countdown h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .countdown-timer {
            font-size: 48px;
            font-weight: bold;
            color: #4F8EFF;
            margin: 20px 0;
        }

        .countdown-progress {
            width: 200px;
            height: 4px;
            background: rgba(79, 142, 255, 0.2);
            border-radius: 2px;
            margin: 20px auto;
            overflow: hidden;
        }

        .countdown-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4F8EFF, #00D4FF);
            animation: progress 30s linear forwards;
        }

        @keyframes progress {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0F1929;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(79, 142, 255, 0.3);
        }

        .modal-close {
            float: left;
            background: none;
            border: none;
            color: #F1F5FF;
            font-size: 24px;
            cursor: pointer;
        }

        .error-message {
            color: #FF6B6B;
            font-size: 12px;
            margin-top: 5px;
        }

        .success-message {
            color: #51CF66;
            font-size: 12px;
            margin-top: 5px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(79, 142, 255, 0.3);
            border-top-color: #4F8EFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .add-ons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .add-on-card {
            background: linear-gradient(135deg, #1A2847 0%, #0F1929 100%);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(79, 142, 255, 0.2);
            transition: all 0.3s ease;
        }

        .add-on-card:hover {
            border-color: #4F8EFF;
            background: linear-gradient(135deg, #1A2847 0%, #1A3052 100%);
        }

        .add-on-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .add-on-name {
            font-size: 14px;
            font-weight: 600;
            color: #7DD3FC;
        }

        .footer {
            background: linear-gradient(135deg, #0F1929 0%, #1A2847 100%);
            padding: 30px 20px;
            text-align: center;
            color: rgba(241, 245, 255, 0.5);
            font-size: 12px;
            margin-top: 40px;
            border-top: 1px solid rgba(79, 142, 255, 0.2);
        }

        .footer a {
            color: #4F8EFF;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }

            .search-bar {
                width: 100%;
                margin: 15px 0;
            }

            .movie-card {
                flex: 0 0 150px;
            }

            .auth-section {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="nav-toggle" id="menuToggle">☰</button>
        <div class="logo">SratTV</div>
        <div class="search-bar">
            <div class="search-icon"></div>
            <input type="text" id="searchInput" placeholder="חיפוש...">
        </div>
        <button class="nav-toggle" id="userToggle">👤</button>
        <div class="user-menu" id="userMenu">
            <button id="profileBtn">פרופיל</button>
            <button id="logoutBtn">התנתק</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Hero Section -->
        <div class="hero">
            <h1>ברוכים הבאים ל-SratTV</h1>
            <p>סטרימינג ישראלי עם אלפי סרטים וסדרות</p>
        </div>

        <!-- Auth Section -->
        <div id="authSection" class="auth-section">
            <div id="loginForm">
                <h2>כניסה</h2>
                <div class="form-group">
                    <label>שם משתמש</label>
                    <input type="text" id="loginUsername" placeholder="שם משתמש">
                </div>
                <div class="form-group">
                    <label>סיסמה</label>
                    <input type="password" id="loginPassword" placeholder="סיסמה">
                </div>
                <button class="btn" id="loginBtn">כניסה</button>
                <button class="btn toggle-btn" id="toggleRegisterBtn">עברת ל-הרשמה</button>
                <div id="loginError" class="error-message"></div>
            </div>

            <div id="registerForm" style="display: none;">
                <h2>הרשמה</h2>
                <div class="form-group">
                    <label>שם משתמש</label>
                    <input type="text" id="registerUsername" placeholder="שם משתמש">
                </div>
                <div class="form-group">
                    <label>אימייל</label>
                    <input type="email" id="registerEmail" placeholder="אימייל">
                </div>
                <div class="form-group">
                    <label>סיסמה</label>
                    <input type="password" id="registerPassword" placeholder="סיסמה">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="tosCheckbox" required>
                    <label for="tosCheckbox">
                        אני מסכים ל<a href="/privacy" target="_blank">מדיניות הפרטיות</a>
                    </label>
                </div>
                <button class="btn" id="registerBtn">הרשמה</button>
                <button class="btn toggle-btn" id="toggleLoginBtn">חזור לכניסה</button>
                <div id="registerError" class="error-message"></div>
            </div>
        </div>

        <!-- Trending Section -->
        <h2 class="section-title">🔥 פופולרי עכשיו</h2>
        <div class="carousel" id="trendingCarousel">
            <div style="text-align: center; width: 100%; color: rgba(241, 245, 255, 0.5);">
                <div class="loading"></div>
            </div>
        </div>

        <!-- Israeli Content Section -->
        <h2 class="section-title">🇮🇱 תוכן ישראלי</h2>
        <div class="carousel" id="israeliCarousel">
            <div style="text-align: center; width: 100%; color: rgba(241, 245, 255, 0.5);">
                <div class="loading"></div>
            </div>
        </div>

        <!-- Add-ons Section -->
        <h2 class="section-title">➕ תוספים</h2>
        <div class="add-ons-grid" id="addOnsGrid">
            <!-- Add-ons will be populated here -->
        </div>
    </div>

    <!-- Player Container -->
    <div class="player-container" id="playerContainer">
        <button class="player-close" id="playerClose">✕</button>
        <div class="countdown" id="countdown">
            <h2>הסרט מתחיל בעוד:</h2>
            <div class="countdown-timer" id="countdownTimer">30</div>
            <div class="countdown-progress">
                <div class="countdown-progress-bar"></div>
            </div>
        </div>
        <iframe id="videoPlayer" width="90%" height="90%" style="display: none; border-radius: 10px;" allowfullscreen></iframe>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <button class="modal-close" id="profileClose">✕</button>
            <h2>פרופיל</h2>
            <div id="profileData"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" id="homeNav">
            <span class="nav-icon">🏠</span>
            <span>בית</span>
        </button>
        <button class="nav-item" id="searchNav">
            <span class="nav-icon">🔍</span>
            <span>חיפוש</span>
        </button>
        <button class="nav-item" id="iptvNav">
            <span class="nav-icon">📡</span>
            <span>IPTV</span>
        </button>
        <button class="nav-item" id="settingsNav">
            <span class="nav-icon">⚙️</span>
            <span>הגדרות</span>
        </button>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2024 SratTV. כל הזכויות שמורות.</p>
        <p>
            <a href="/privacy">מדיניות פרטיות</a> | 
            <a href="/tos">תנאי שימוש</a>
        </p>
    </div>

    <script>
        // ==================== CONFIG ====================
        const API_BASE = window.location.origin;
        const TMDB_API_KEY = "188a869e1edf45ff689684b7167be046";
        
        // ==================== STATE ====================
        let currentUser = null;
        let currentToken = null;
        let isPremium = false;

        // ==================== AUTH FUNCTIONS ====================
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                showError('loginError', 'יש למלא את כל השדות');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail);

                currentUser = data.username;
                currentToken = data.token;
                isPremium = data.tier === 'premium';
                localStorage.setItem('token', currentToken);
                localStorage.setItem('username', currentUser);

                document.getElementById('authSection').style.display = 'none';
                loadTrendingContent();
                loadIsraeliContent();
            } catch (error) {
                showError('loginError', error.message);
            }
        });

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const tos = document.getElementById('tosCheckbox').checked;

            if (!username || !email || !password || !tos) {
                showError('registerError', 'יש למלא את כל השדות ולהסכים לתנאים');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, accept_tos: tos })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail);

                currentUser = data.username;
                currentToken = data.token;
                isPremium = false;
                localStorage.setItem('token', currentToken);
                localStorage.setItem('username', currentUser);

                document.getElementById('authSection').style.display = 'none';
                loadTrendingContent();
                loadIsraeliContent();
            } catch (error) {
                showError('registerError', error.message);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            currentUser = null;
            currentToken = null;
            isPremium = false;
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('trendingCarousel').innerHTML = '';
            document.getElementById('israeliCarousel').innerHTML = '';
        });

        document.getElementById('toggleRegisterBtn').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        });

        document.getElementById('toggleLoginBtn').addEventListener('click', () => {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        });

        // ==================== UI FUNCTIONS ====================
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        document.getElementById('userToggle').addEventListener('click', () => {
            document.getElementById('userMenu').classList.toggle('active');
        });

        document.getElementById('profileBtn').addEventListener('click', async () => {
            if (!currentToken) return;
            try {
                const response = await fetch(`${API_BASE}/api/profile?token=${currentToken}`);
                const data = await response.json();
                document.getElementById('profileData').innerHTML = `
                    <p><strong>שם משתמש:</strong> ${data.username}</p>
                    <p><strong>אימייל:</strong> ${data.email}</p>
                    <p><strong>חבילה:</strong> ${data.tier === 'premium' ? 'פרימיום' : 'חינם'}</p>
                    <p><strong>הצטרפות:</strong> ${new Date(data.created_at).toLocaleDateString('he-IL')}</p>
                `;
                document.getElementById('profileModal').classList.add('active');
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        });

        document.getElementById('profileClose').addEventListener('click', () => {
            document.getElementById('profileModal').classList.remove('active');
        });

        // ==================== TMDB FUNCTIONS ====================
        async function loadTrendingContent() {
            try {
                const response = await fetch(`${API_BASE}/api/tmdb/trending?page=1`);
                const data = await response.json();
                const carousel = document.getElementById('trendingCarousel');
                carousel.innerHTML = '';

                if (data.results && data.results.length > 0) {
                    data.results.slice(0, 10).forEach(item => {
                        const card = createMovieCard(item);
                        carousel.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error loading trending:', error);
            }
        }

        async function loadIsraeliContent() {
            try {
                const response = await fetch(`${API_BASE}/api/tmdb/search?q=israel&page=1`);
                const data = await response.json();
                const carousel = document.getElementById('israeliCarousel');
                carousel.innerHTML = '';

                if (data.results && data.results.length > 0) {
                    data.results.slice(0, 10).forEach(item => {
                        const card = createMovieCard(item);
                        carousel.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error loading Israeli content:', error);
            }
        }

        function createMovieCard(item) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            const posterPath = item.poster_path ? `https://image.tmdb.org/t/p/w200${item.poster_path}` : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg"><rect fill="%231A2847" width="200" height="300"/></svg>';
            const title = item.title || item.name || 'No Title';
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';

            card.innerHTML = `
                <img src="${posterPath}" alt="${title}">
                <div class="movie-card-overlay">
                    <div class="movie-title">${title}</div>
                    <div class="movie-rating">⭐ ${rating}</div>
                </div>
            `;

            card.addEventListener('click', () => playMovie(item));
            return card;
        }

        // ==================== PLAYER FUNCTIONS ====================
        function playMovie(item) {
            if (!currentToken) {
                showError('loginError', 'יש להתחבר קודם');
                return;
            }

            const playerContainer = document.getElementById('playerContainer');
            const countdown = document.getElementById('countdown');
            const videoPlayer = document.getElementById('videoPlayer');
            const countdownTimer = document.getElementById('countdownTimer');

            playerContainer.classList.add('active');
            countdown.style.display = 'block';
            videoPlayer.style.display = 'none';

            let timeLeft = 30;
            countdownTimer.textContent = timeLeft;

            const countdownInterval = setInterval(() => {
                timeLeft--;
                countdownTimer.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    countdown.style.display = 'none';
                    videoPlayer.style.display = 'block';

                    const movieUrl = isPremium 
                        ? `https://embed.smashystream.com/playembeded.php?id=${item.id}`
                        : `https://www.youtube.com/embed/${item.id}?autoplay=1`;

                    videoPlayer.src = movieUrl;
                }
            }, 1000);
        }

        document.getElementById('playerClose').addEventListener('click', () => {
            document.getElementById('playerContainer').classList.remove('active');
            document.getElementById('videoPlayer').src = '';
        });

        // ==================== ADD-ONS ====================
        const addOns = [
            { name: 'Torrentino', icon: '🌀' },
            { name: 'Real-Debrid', icon: '⚡' },
            { name: 'OpenSubtitles', icon: '📝' }
        ];

        const addOnsGrid = document.getElementById('addOnsGrid');
        addOns.forEach(addon => {
            const card = document.createElement('div');
            card.className = 'add-on-card';
            card.innerHTML = `
                <div class="add-on-icon">${addon.icon}</div>
                <div class="add-on-name">${addon.name}</div>
            `;
            addOnsGrid.appendChild(card);
        });

        // ==================== NAVIGATION ====================
        document.getElementById('homeNav').addEventListener('click', () => {
            window.scrollTo(0, 0);
        });

        document.getElementById('iptvNav').addEventListener('click', () => {
            alert('IPTV עובד רק בדפדפנים של שרת');
        });

        // ==================== INIT ====================
        window.addEventListener('load', () => {
            const savedToken = localStorage.getItem('token');
            const savedUsername = localStorage.getItem('username');

            if (savedToken && savedUsername) {
                currentUser = savedUsername;
                currentToken = savedToken;
                document.getElementById('authSection').style.display = 'none';
                loadTrendingContent();
                loadIsraeliContent();
            }
        });
    </script>
</body>
</html>
