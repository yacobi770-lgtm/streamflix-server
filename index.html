<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060A12">
    <title>SratTV - סטרימינג ישראלי</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060A12;
            color: #F1F5FF;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #4F8EFF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(241, 245, 255, 0.6);
        }

        .auth-box {
            background: linear-gradient(135deg, #1A2847 0%, #0F1929 100%);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(79, 142, 255, 0.3);
        }

        .auth-box h2 {
            color: #4F8EFF;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(241, 245, 255, 0.7);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(79, 142, 255, 0.1);
            border: 1px solid rgba(79, 142, 255, 0.3);
            border-radius: 8px;
            color: #F1F5FF;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4F8EFF;
            background: rgba(79, 142, 255, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4F8EFF, #00D4FF);
            border: none;
            border-radius: 8px;
            color: #060A12;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 142, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #FF6B6B;
            font-size: 12px;
            margin-top: 10px;
            display: none;
            background: rgba(255, 107, 107, 0.1);
            padding: 8px;
            border-radius: 5px;
        }

        .error-message.show {
            display: block;
        }

        .toggle-text {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: rgba(241, 245, 255, 0.6);
        }

        .toggle-text button {
            background: none;
            border: none;
            color: #4F8EFF;
            cursor: pointer;
            text-decoration: underline;
            font-size: 12px;
        }

        .toggle-text button:hover {
            color: #00D4FF;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            font-size: 12px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4F8EFF;
        }

        .checkbox-group a {
            color: #4F8EFF;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: rgba(241, 245, 255, 0.4);
        }

        .footer a {
            color: #4F8EFF;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .auth-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">SratTV</div>
            <p class="subtitle">סטרימינג ישראלי</p>
        </div>

        <div class="auth-box">
            <!-- Login Form -->
            <div id="loginForm">
                <h2>כניסה</h2>
                <div class="form-group">
                    <label>שם משתמש</label>
                    <input type="text" id="loginUsername" placeholder="שם משתמש">
                </div>
                <div class="form-group">
                    <label>סיסמה</label>
                    <input type="password" id="loginPassword" placeholder="סיסמה">
                </div>
                <button class="btn" id="loginBtn">כניסה</button>
                <div id="loginError" class="error-message"></div>
                <div class="toggle-text">
                    אין לך חשבון? <button id="toggleRegisterBtn">הרשם כאן</button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <h2>הרשמה</h2>
                <div class="form-group">
                    <label>שם משתמש</label>
                    <input type="text" id="registerUsername" placeholder="שם משתמש">
                </div>
                <div class="form-group">
                    <label>אימייל</label>
                    <input type="email" id="registerEmail" placeholder="אימייל">
                </div>
                <div class="form-group">
                    <label>סיסמה</label>
                    <input type="password" id="registerPassword" placeholder="סיסמה">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="tosCheckbox">
                    <label>אני מסכים ל<a href="/privacy" target="_blank">מדיניות הפרטיות</a></label>
                </div>
                <button class="btn" id="registerBtn">הרשמה</button>
                <div id="registerError" class="error-message"></div>
                <div class="toggle-text">
                    כבר יש לך חשבון? <button id="toggleLoginBtn">התחבר כאן</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2024 SratTV. כל הזכויות שמורות.</p>
            <p>
                <a href="/privacy">מדיניות פרטיות</a> | 
                <a href="/tos">תנאי שימוש</a>
            </p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = message;
                element.classList.add('show');
                setTimeout(() => {
                    element.classList.remove('show');
                }, 5000);
            }
        }

        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if (!username || !password) {
                showError('loginError', 'יש למלא שם משתמש וסיסמה');
                return;
            }

            fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    
                    alert(`ברוכים הבאים ${data.username}!`);
                    location.reload();
                } else {
                    showError('loginError', data.detail || 'שגיאה בכניסה');
                }
            })
            .catch(e => showError('loginError', 'שגיאת רשת'));
        }

        function handleRegister() {
            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            const tos = document.getElementById('tosCheckbox').checked;

            if (!username || !email || !password || !tos) {
                showError('registerError', 'יש למלא את כל השדות');
                return;
            }

            fetch(`${API_BASE}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password, accept_tos: tos })
            })
            .then(res => res.json())
            .then(data => {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    
                    alert(`הרשמה בוצעה בהצלחה! ברוכים הבאים ${data.username}!`);
                    location.reload();
                } else {
                    showError('registerError', data.detail || 'שגיאה בהרשמה');
                }
            })
            .catch(e => showError('registerError', 'שגיאת רשת'));
        }

        document.getElementById('loginBtn').addEventListener('click', handleLogin);
        document.getElementById('registerBtn').addEventListener('click', handleRegister);

        document.getElementById('toggleRegisterBtn').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        });

        document.getElementById('toggleLoginBtn').addEventListener('click', () => {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        });

        document.getElementById('loginPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        document.getElementById('registerPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleRegister();
        });
    </script>
</body>
</html>
