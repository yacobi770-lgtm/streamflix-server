<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060A12">
    <title>SratTV - סטרימינג ישראלי</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060A12;
            color: #F1F5FF;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, rgba(15, 25, 41, 0.95), rgba(26, 40, 71, 0.95));
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(79, 142, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #4F8EFF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .username {
            font-size: 12px;
            color: rgba(241, 245, 255, 0.7);
        }

        .logout-btn {
            background: rgba(79, 142, 255, 0.2);
            border: 1px solid rgba(79, 142, 255, 0.4);
            color: #4F8EFF;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(79, 142, 255, 0.3);
        }

        .search-bar {
            background: rgba(79, 142, 255, 0.1);
            border: 1px solid rgba(79, 142, 255, 0.3);
            padding: 10px 15px;
            border-radius: 8px;
            color: #F1F5FF;
            margin: 15px 20px;
            font-size: 14px;
        }

        .search-bar:focus {
            outline: none;
            border-color: #4F8EFF;
        }

        .container {
            padding: 20px;
            padding-bottom: 100px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 30px 0 15px 0;
            color: #4F8EFF;
        }

        .carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        .carousel::-webkit-scrollbar {
            height: 6px;
        }

        .carousel::-webkit-scrollbar-track {
            background: rgba(79, 142, 255, 0.1);
            border-radius: 10px;
        }

        .carousel::-webkit-scrollbar-thumb {
            background: rgba(79, 142, 255, 0.5);
            border-radius: 10px;
        }

        .item {
            min-width: 150px;
            background: linear-gradient(135deg, #1A2847, #0F1929);
            border: 1px solid rgba(79, 142, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .item:hover {
            transform: translateY(-5px);
            border-color: #4F8EFF;
            box-shadow: 0 10px 25px rgba(79, 142, 255, 0.2);
        }

        .item-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #4F8EFF, #00D4FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .item-title {
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: right;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(15, 25, 41, 0), rgba(15, 25, 41, 0.98));
            border-top: 1px solid rgba(79, 142, 255, 0.2);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 15px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: rgba(241, 245, 255, 0.6);
            font-size: 11px;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: #4F8EFF;
        }

        .nav-item:hover {
            color: #00D4FF;
        }

        .nav-icon {
            font-size: 24px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: rgba(241, 245, 255, 0.6);
        }

        .addon-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .addon-item {
            background: linear-gradient(135deg, #1A2847, #0F1929);
            border: 1px solid rgba(79, 142, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .addon-item:hover {
            transform: translateY(-5px);
            border-color: #4F8EFF;
            box-shadow: 0 10px 25px rgba(79, 142, 255, 0.2);
        }

        .addon-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .addon-title {
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .item {
                min-width: 120px;
            }

            .item-image {
                height: 150px;
            }

            .section-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">SratTV</div>
        <div class="user-info">
            <span class="username" id="userDisplay">משתמש</span>
            <button class="logout-btn" id="logoutBtn">התנתק</button>
        </div>
    </div>

    <input type="text" class="search-bar" id="searchBar" placeholder="חיפוש סרטים וסדרות...">

    <div class="container">
        <!-- פופולרי עכשיו -->
        <div id="popularSection">
            <h2 class="section-title">🔥 פופולרי עכשיו</h2>
            <div class="carousel" id="popularCarousel">
                <div class="loading">טוען...</div>
            </div>
        </div>

        <!-- תוכן ישראלי -->
        <div id="israeliSection">
            <h2 class="section-title">🇮🇱 תוכן ישראלי</h2>
            <div class="carousel" id="israeliCarousel">
                <div class="loading">טוען...</div>
            </div>
        </div>

        <!-- תוספים -->
        <div id="addonsSection">
            <h2 class="section-title">➕ תוספים</h2>
            <div class="addon-section" id="addonsList">
                <div class="loading">טוען...</div>
            </div>
        </div>

        <!-- IPTV -->
        <div id="iptvSection">
            <h2 class="section-title">📡 IPTV</h2>
            <div class="carousel" id="iptvCarousel">
                <div class="loading">טוען...</div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" id="homeNav">
            <div class="nav-icon">🏠</div>
            <div>בית</div>
        </div>
        <div class="nav-item" id="searchNav">
            <div class="nav-icon">🔍</div>
            <div>חיפוש</div>
        </div>
        <div class="nav-item" id="iptvNav">
            <div class="nav-icon">📡</div>
            <div>IPTV</div>
        </div>
        <div class="nav-item" id="settingsNav">
            <div class="nav-icon">⚙️</div>
            <div>הגדרות</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentUser = null;
        let currentToken = null;

        // בדוק אם מחובר
        function checkLogin() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');

            if (!token || !username) {
                window.location.href = '/';
                return;
            }

            currentToken = token;
            currentUser = username;
            document.getElementById('userDisplay').textContent = username;
        }

        // התנתק
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.href = '/';
        }

        // טען סרטים פופולריים מ-TMDB
        async function loadPopular() {
            try {
                const response = await fetch(`${API_BASE}/api/popular?page=1`);
                const data = await response.json();
                
                const carousel = document.getElementById('popularCarousel');
                carousel.innerHTML = '';

                if (data.results && data.results.length > 0) {
                    data.results.slice(0, 10).forEach(movie => {
                        const item = document.createElement('div');
                        item.className = 'item';
                        item.innerHTML = `
                            <div class="item-image">🎬</div>
                            <div class="item-title">${movie.title || movie.name}</div>
                        `;
                        item.onclick = () => playMovie(movie.id, movie.title || movie.name);
                        carousel.appendChild(item);
                    });
                } else {
                    carousel.innerHTML = '<div class="loading">לא נמצאו סרטים</div>';
                }
            } catch (e) {
                document.getElementById('popularCarousel').innerHTML = '<div class="loading">שגיאה בטעינה</div>';
            }
        }

        // טען סדרות ישראליות (חיפוש)
        async function loadIsraeli() {
            try {
                const response = await fetch(`${API_BASE}/api/search?query=hebrew&page=1`);
                const data = await response.json();
                
                const carousel = document.getElementById('israeliCarousel');
                carousel.innerHTML = '';

                if (data.results && data.results.length > 0) {
                    data.results.slice(0, 10).forEach(item => {
                        const elem = document.createElement('div');
                        elem.className = 'item';
                        elem.innerHTML = `
                            <div class="item-image">📺</div>
                            <div class="item-title">${item.title || item.name}</div>
                        `;
                        elem.onclick = () => playMovie(item.id, item.title || item.name);
                        carousel.appendChild(elem);
                    });
                } else {
                    carousel.innerHTML = '<div class="loading">לא נמצאו סדרות</div>';
                }
            } catch (e) {
                document.getElementById('israeliCarousel').innerHTML = '<div class="loading">שגיאה בטעינה</div>';
            }
        }

        // טען תוספים
        function loadAddons() {
            const addons = [
                { name: 'Torrentino', icon: '⚡', type: 'video' },
                { name: 'Real-Debrid', icon: '🔓', type: 'video' },
                { name: 'OpenSubtitles', icon: '📝', type: 'subtitles' }
            ];

            const list = document.getElementById('addonsList');
            list.innerHTML = '';

            addons.forEach(addon => {
                const elem = document.createElement('div');
                elem.className = 'addon-item';
                elem.innerHTML = `
                    <div class="addon-icon">${addon.icon}</div>
                    <div class="addon-title">${addon.name}</div>
                `;
                list.appendChild(elem);
            });
        }

        // טען IPTV
        function loadIPTV() {
            const channels = [
                { name: 'Channel 1', icon: '📺' },
                { name: 'Channel 2', icon: '📺' },
                { name: 'Sports+', icon: '⚽' },
                { name: 'Movies', icon: '🎬' }
            ];

            const carousel = document.getElementById('iptvCarousel');
            carousel.innerHTML = '';

            channels.forEach(channel => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div class="item-image">${channel.icon}</div>
                    <div class="item-title">${channel.name}</div>
                `;
                item.onclick = () => playChannel(channel.name);
                carousel.appendChild(item);
            });
        }

        // נגן סרט
        function playMovie(id, title) {
            alert(`משחק: ${title}\n\nID: ${id}`);
            // כאן תוכל להוסיף לוגיקת נגן בפועל
        }

        // נגן ערוץ IPTV
        function playChannel(name) {
            alert(`משחק ערוץ: ${name}`);
            // כאן תוכל להוסיף לוגיקת IPTV בפועל
        }

        // ניווט
        document.getElementById('homeNav').onclick = () => location.reload();
        document.getElementById('searchNav').onclick = () => alert('חיפוש - בקרוב');
        document.getElementById('iptvNav').onclick = () => document.getElementById('iptvSection').scrollIntoView();
        document.getElementById('settingsNav').onclick = () => alert('הגדרות - בקרוב');

        // התנתק
        document.getElementById('logoutBtn').onclick = logout;

        // חיפוש
        document.getElementById('searchBar').onkeypress = (e) => {
            if (e.key === 'Enter') {
                alert(`חיפוש: ${e.target.value}`);
            }
        };

        // טעינה ראשונית
        window.addEventListener('load', () => {
            checkLogin();
            loadPopular();
            loadIsraeli();
            loadAddons();
            loadIPTV();
        });
    </script>
</body>
</html>
